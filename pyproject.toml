[project]
name = "kartstudy"
version = "0.1.0"
authors = [
    { name = "BshKatrin", email = "dyanko.ekaterina2015@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.8.1",
    "numpy>=2.5.4",
    "omegaconf>=2.3,<3",
    "pillow>=11.3.0",
    "pystk2-gymnasium==0.10.0",
    "rl-mind==0.4.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
extend-exclude = ["src/kartstudy/_team4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
